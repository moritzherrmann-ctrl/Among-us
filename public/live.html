<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1e">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Live-Board – Among Us Real Life</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/live.css">
</head>
<body class="live">
  <div class="stars"></div>
  <main class="live-wrap">
    <section id="login" class="screen container">
      <div class="hero"><h1>LIVE-BOARD</h1></div>
      <form id="login-form" class="card">
        <label for="pin">Moderator-PIN</label>
        <input id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" required>
        <button class="btn primary big" type="submit">Anzeigen</button>
      </form>
      <p class="hint center">Steuerung fürs Handy: <a href="/moderator">Moderatoren-Ansicht</a></p>
    </section>

    <section id="board" class="screen hidden">
      <header class="live-header">
        <div class="live-title">
          <h1><svg class="logo" viewBox="0 0 100 115" aria-hidden="true"><rect x="6" y="42" width="20" height="44" rx="9" fill="#c51111" stroke="#000" stroke-width="5"/><path d="M22 50 Q22 8 55 8 Q88 8 88 50 L88 98 Q88 108 78 108 L68 108 Q61 108 61 98 L61 92 L49 92 L49 98 Q49 108 39 108 L32 108 Q22 108 22 98 Z" fill="#c51111" stroke="#000" stroke-width="5"/><path d="M46 30 Q46 22 56 22 L82 22 Q95 22 95 37 Q95 50 82 50 L56 50 Q46 50 46 40 Z" fill="#9ad6e9" stroke="#000" stroke-width="5"/></svg> Among Us <span>Live</span></h1>
          <div id="live-badges"></div>
        </div>
        <div class="live-controls">
          <label class="mode-switch" title="Rollen, Kills und Live-Stimmen anzeigen">
            <input type="checkbox" id="secret-toggle">
            <span id="secret-label">Geheimnisse zeigen</span>
          </label>
          <button class="btn secondary small" id="fullscreen-btn" type="button">⛶ Vollbild</button>
        </div>
      </header>
      <div id="live-main"></div>
    </section>
  </main>
  <div id="overlay"></div>
  <div id="tip" class="tip" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/live.js"></script>
</body>
</html>
